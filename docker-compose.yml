# One command for local dev: `docker compose up`
# Brings up Postgres, the Go backend, and the Next.js frontend with hot reload.
# No local installs of Go, Node, or Postgres required.

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"            # host:container — connect from your Mac with psql -p 5433
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@postgres:5432/portfolio?sslmode=disable
      PORT: "8080"
      ALLOWED_ORIGINS: "http://localhost:3000"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM: ${CONTACT_FROM:-no-reply@thurakkal.com}
      CONTACT_TO: ${CONTACT_TO:-nabeel.thurakkal92@gmail.com}
      CONTACT_RATE_LIMIT_PER_HOUR: "5"
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: portfolio_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"       # Reliable file watching across Docker on macOS/Windows
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app             # bind-mount source for hot reload
      - /app/node_modules           # keep image node_modules
      - /app/.next                  # keep image build cache

volumes:
  postgres-data:
